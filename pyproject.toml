[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-rag"
version = "0.2.0"
description = "Ask a Mneme local second brain with LangChain RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lucidyn" }]
keywords = ["rag", "langchain", "mneme", "ollama", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Lucidyn/mneme-rag"
Repository = "https://github.com/Lucidyn/mneme-rag"
Issues = "https://github.com/Lucidyn/mneme-rag/issues"
"Mneme" = "https://github.com/Lucidyn/Mneme"

[project.scripts]
mneme-rag = "mneme_rag.cli:main"

[tool.setuptools.packages.find]
include = ["mneme_rag*"]
